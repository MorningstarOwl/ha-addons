name: Music MCP
description: >
  Voice-friendly MCP server for playing a local music library through
  Music Assistant. Searches the library, plays the resolved item, and
  names what it actually found — so an assistant can answer open-ended
  music requests without inventing streaming-shaped queries the library
  cannot match. Intended as the fallback path for requests a local
  sentence trigger cannot handle. Returns plain spoken English — no
  markdown, no symbols.
version: "0.2.0"
slug: music_mcp
url: https://github.com/MorningstarOwl/ha-addons/tree/main/music_mcp
init: false
arch:
  - amd64
  - aarch64

# Expose SSE endpoint on the LAN
ports:
  8767/tcp: 8767
ports_description:
  8767/tcp: "MCP SSE endpoint — configure HA with http://homeassistant.local:8767/sse"

# Authorizes SUPERVISOR_TOKEN against HA Core's REST API
# (http://supervisor/core/api/*). Required for calling music_assistant
# services. NOT the same as hassio_api, which authorizes calls to the
# Supervisor's own API.
homeassistant_api: true

# User-configurable options (shown in the addon Configuration tab)
options:
  default_speaker: ""
  speaker_aliases: []

schema:
  # Optional: when Music Assistant exposes exactly one player, the add-on
  # discovers it and says so in the log. Set this only to override that, or
  # when there is more than one player to choose between.
  default_speaker: str?
  speaker_aliases:
    - name: str
      entity_id: str

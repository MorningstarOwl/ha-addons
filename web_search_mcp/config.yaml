name: Web Search MCP
description: >
  MCP search server for Home Assistant. Bundles a privacy-respecting
  SearXNG metasearch instance and exposes web/news search as MCP tools
  over SSE — suitable for Home Assistant Assist and TTS voice pipelines.
  No external dependencies or configuration required.
version: "1.3.0"
slug: web_search_mcp
url: https://github.com/MorningstarOwl/ha-addons/tree/main/web_search_mcp
init: false
arch:
  - amd64
  - aarch64
  - armv7

ports:
  8766/tcp: 8766
ports_description:
  8766/tcp: "MCP SSE endpoint — configure HA with http://homeassistant.local:8766/sse"

options:
  max_results: 5
  safe_search: 0
  language: "all"
  engines: ""

schema:
  max_results: int(1,10)
  safe_search: list(0|1|2)
  language: str
  engines: str

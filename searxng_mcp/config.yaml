name: SearXNG MCP
description: >
  All-in-one MCP search server for Home Assistant.
  Bundles SearXNG and exposes web search and news search as MCP tools over SSE,
  returning results as plain spoken English — suitable for
  Home Assistant Assist and TTS voice pipelines. No external dependencies required.
version: "1.1.0"
slug: searxng_mcp
url: https://github.com/MorningstarOwl/ha-addons/tree/main/searxng_mcp
init: false
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386

ports:
  8766/tcp: 8766
ports_description:
  8766/tcp: "MCP SSE endpoint — configure HA with http://homeassistant.local:8766/sse"

options:
  max_results: 5
  safe_search: 0
  language: "en"

schema:
  max_results: int(1,10)
  safe_search: list(0|1|2)
  language: str

name: Web Search MCP
description: >
  MCP search server for Home Assistant. Uses DuckDuckGo to deliver web search
  and news search as MCP tools over SSE, returning results as plain spoken
  English — suitable for Home Assistant Assist and TTS voice pipelines.
  No external dependencies or configuration required.
version: "1.2.0"
slug: searxng_mcp
url: https://github.com/MorningstarOwl/ha-addons/tree/main/searxng_mcp
init: false
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386

ports:
  8766/tcp: 8766
ports_description:
  8766/tcp: "MCP SSE endpoint — configure HA with http://homeassistant.local:8766/sse"

options:
  max_results: 5
  safe_search: 0

schema:
  max_results: int(1,10)
  safe_search: list(0|1|2)
